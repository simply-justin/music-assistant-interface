# A version tag (v1.2.0) builds the firmware and publishes it as a GitHub release. Panels find it
# under Settings › About › Check for updates (main/Kconfig.projbuild, PANEL_UPDATE_URL).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  firmware:
    name: Build and publish firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the firmware version comes from `git describe`: the tag
      - name: Build with ESP-IDF 5.5.6
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32p4
          # In the container the checkout belongs to another user: without this git describe fails
          # and the version would not be the tag.
          command: git config --global --add safe.directory '*' && idf.py build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            build/music_panel.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin
